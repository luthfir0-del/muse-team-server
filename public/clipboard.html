<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Baca Clipboard</title>
<style>body{font-family:sans-serif;padding:40px}button{font-size:28px;padding:16px 32px}pre{font-size:22px;word-break:break-all;white-space:pre-wrap;margin-top:30px}</style>
</head>
<body>
<h1>Baca Clipboard</h1>
<p>Halaman ini hanya membaca clipboard browser ini dan menampilkannya di bawah. Tidak ada data yang dikirim ke mana pun.</p>
<button id="read">READ</button>
<pre id="out">(belum dibaca)</pre>
<script>
document.getElementById('read').addEventListener('click', async () => {
  const out = document.getElementById('out');
  try {
    const t = await navigator.clipboard.readText();
    out.textContent = t ? t : '(clipboard kosong)';
  } catch (e) {
    out.textContent = 'ERR: ' + (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : e);
  }
});
</script>
</body>
</html>
